<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZORD | Terminal de Sellado PQC</title>
    <style>
        :root {
            --bg-dark: #05070a;
            --bg-panel: #0d1117;
            --neon-cyan: #00ffcc;
            --neon-purple: #7c4dff;
            --neon-green: #00e676;
            --neon-red: #ff3d00;
            --text-main: #c9d1d9;
            --text-muted: #8b949e;
        }
        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            margin: 0;
            padding: 40px 20px;
            background-image: radial-gradient(circle at 50% 0%, #0d1b2a 0%, transparent 60%);
        }
        .terminal {
            background: var(--bg-panel);
            max-width: 650px;
            margin: auto;
            padding: 40px;
            border-radius: 8px;
            border: 1px solid rgba(0, 255, 204, 0.3);
            box-shadow: 0 0 25px rgba(0, 255, 204, 0.1);
        }
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px dashed rgba(255,255,255,0.2);
            padding-bottom: 15px;
            margin-bottom: 25px;
        }
        .nav-back {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.85rem;
            border: 1px solid #30363d;
            padding: 6px 12px;
            border-radius: 4px;
            transition: 0.2s;
        }
        .nav-back:hover { color: var(--neon-cyan); border-color: var(--neon-cyan); }
        h2 { color: var(--neon-cyan); margin: 0; font-size: 1.4rem; }
        .subtitle { font-size: 0.85rem; color: var(--text-muted); margin-top: 5px; }
        label { display: block; font-weight: bold; font-size: 0.85rem; color: var(--neon-cyan); margin-bottom: 8px; }
        .input-box {
            width: 100%;
            padding: 12px;
            background: #04080f;
            border: 1px solid #30363d;
            color: #fff;
            border-radius: 4px;
            margin-bottom: 22px;
            box-sizing: border-box;
            font-family: inherit;
        }
        .input-box:focus { outline: none; border-color: var(--neon-cyan); }
        .btn-sellar {
            background-color: var(--neon-cyan);
            color: #000;
            padding: 14px;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            font-family: inherit;
            font-size: 0.95rem;
            text-transform: uppercase;
            transition: 0.2s;
        }
        .btn-sellar:hover { background-color: #00cca3; box-shadow: 0 0 15px rgba(0, 255, 204, 0.4); }
        .btn-sellar:disabled { background-color: #30363d; color: #8b949e; cursor: not-allowed; box-shadow: none; }
        #status {
            margin-top: 25px;
            font-size: 0.85rem;
            padding: 15px;
            border-radius: 4px;
            display: none;
            line-height: 1.5;
        }
    </style>
</head>
<body>

<div class="terminal">
    <div class="header-bar">
        <div>
            <h2>🛡️ TERMINAL DE SELLADO PQC</h2>
            <div class="subtitle">Estándar FIPS 204 (ML-DSA-44) | Ley 19.799</div>
        </div>
        <a href="index.html" class="nav-back">← Portal</a>
    </div>
    
    <div>
        <label>1. CREDENCIAL DE ACCESO (API KEY):</label>
        <input type="text" id="apiKey" class="input-box" placeholder="ZORD-XXXX-XXXX">
        
        <label>2. ACTIVO DIGITAL A BLINDAR (PDF, DOCX, ZIP, ETC.):</label>
        <input type="file" id="docToSign" class="input-box">
    </div>

    <button onclick="generarSello()" class="btn-sellar" id="btnSellar">EJECUTAR SELLADO CUÁNTICO (-1 CRÉDITO)</button>
    <div id="status"></div>
</div>

<script>
    async function generarSello() {
        const apiKey = document.getElementById('apiKey').value.trim();
        const fileInput = document.getElementById('docToSign');
        const statusDiv = document.getElementById('status');
        const btn = document.getElementById('btnSellar');

        if (!apiKey) return alert("ALERTA: Debe ingresar una API KEY válida.");
        if (!fileInput.files[0]) return alert("Debe seleccionar un documento para sellar.");

        statusDiv.style.display = "block";
        statusDiv.style.background = "rgba(124, 77, 255, 0.1)";
        statusDiv.style.border = "1px solid var(--neon-purple)";
        statusDiv.style.color = "#d1c4e9";
        statusDiv.innerHTML = "> INYECTANDO ENTROPÍA C++...<br>> GENERANDO FIRMA HÍBRIDA ML-DSA-44...";
        btn.disabled = true;

        const formData = new FormData();
        formData.append('api_key', apiKey);
        formData.append('documento', fileInput.files[0]);

        try {
            const response = await fetch('https://api.zord.cl/api/v1/sellar', {
                method: 'POST',
                body: formData
            });

            if (response.ok) {
                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.style.display = 'none';
                a.href = url;
                a.download = fileInput.files[0].name + '.sig';
                document.body.appendChild(a);
                a.click();
                window.URL.revokeObjectURL(url);
                
                statusDiv.style.background = "rgba(0, 230, 118, 0.1)";
                statusDiv.style.border = "1px solid var(--neon-green)";
                statusDiv.style.color = "var(--neon-green)";
                statusDiv.innerHTML = "[+] SELLADO EXITOSO: Se ha descontado 1 crédito.<br>[+] Certificado criptográfico (<code>.sig</code>) descargado.";
            } else {
                const err = await response.json().catch(() => ({}));
                statusDiv.style.background = "rgba(255, 61, 0, 0.1)";
                statusDiv.style.border = "1px solid var(--neon-red)";
                statusDiv.style.color = "var(--neon-red)";
                statusDiv.innerHTML = "[-] ACCESO DENEGADO: " + (err.detail || err.message || "Credencial inválida o sin saldo.");
            }
        } catch (error) {
            statusDiv.style.background = "rgba(255, 61, 0, 0.1)";
            statusDiv.style.border = "1px solid var(--neon-red)";
            statusDiv.style.color = "var(--neon-red)";
            statusDiv.innerHTML = "[-] ERROR DE RED: No se pudo conectar con https://api.zord.cl.";
        }
        btn.disabled = false;
    }
</script>
</body>
</html>
