<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZORD | Auditoría de Integridad PQC</title>
    <style>
        :root {
            --bg-dark: #05070a;
            --bg-panel: #0d1117;
            --neon-cyan: #00ffcc;
            --neon-blue: #2979ff;
            --neon-green: #00e676;
            --neon-red: #ff3d00;
            --text-main: #c9d1d9;
            --text-muted: #8b949e;
        }
        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            margin: 0;
            padding: 40px 20px;
            background-image: radial-gradient(circle at 50% 0%, #0d1b2a 0%, transparent 60%);
        }
        .verify-box {
            background: var(--bg-panel);
            max-width: 700px;
            margin: auto;
            padding: 40px;
            border-radius: 8px;
            border: 1px dashed var(--neon-cyan);
            box-shadow: 0 0 25px rgba(0, 255, 204, 0.08);
        }
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 15px;
            margin-bottom: 25px;
        }
        .nav-back {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.85rem;
            border: 1px solid #30363d;
            padding: 6px 12px;
            border-radius: 4px;
            transition: 0.2s;
        }
        .nav-back:hover { color: var(--neon-cyan); border-color: var(--neon-cyan); }
        h2 { color: var(--neon-cyan); margin: 0; font-size: 1.35rem; }
        label { display: block; font-size: 0.85rem; font-weight: bold; color: var(--neon-cyan); margin-bottom: 10px; }
        input[type="file"] {
            background: #04080f;
            border: 1px solid #30363d;
            color: var(--text-main);
            padding: 12px;
            width: 100%;
            margin-bottom: 20px;
            border-radius: 4px;
            box-sizing: border-box;
            font-family: inherit;
        }
        .btn-verify {
            background-color: var(--neon-blue);
            border: none;
            color: white;
            width: 100%;
            padding: 14px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            text-transform: uppercase;
            font-family: inherit;
            font-size: 0.95rem;
            transition: 0.2s;
        }
        .btn-verify:hover { background-color: var(--neon-cyan); color: #000; box-shadow: 0 0 15px var(--neon-cyan); }
        #verifyResult {
            margin-top: 25px;
            display: none;
            padding: 20px;
            border-radius: 6px;
            font-size: 0.85rem;
            word-break: break-all;
            line-height: 1.6;
        }
    </style>
</head>
<body>

<div class="verify-box">
    <div class="header-bar">
        <h2>🔍 VALIDADOR DE INTEGRIDAD PQC</h2>
        <a href="index.html" class="nav-back">← Portal</a>
    </div>
    
    <p style="font-size: 0.9rem; color: var(--text-muted); margin-bottom: 25px;">
        Auditoría forense pública. Suba el documento original para verificar su huella criptográfica contra el registro inmutable de ZSecure.
    </p>

    <label>DOCUMENTO ORIGINAL A AUDITAR:</label>
    <input type="file" id="docFile">

    <button onclick="verifyDocument()" class="btn-verify">VERIFICAR INTEGRIDAD EN AWS</button>

    <div id="verifyResult"></div>
</div>

<script>
    async function verifyDocument() {
        const docInput = document.getElementById('docFile');
        const resultDiv = document.getElementById('verifyResult');

        if (!docInput.files[0]) return alert("Seleccione un documento para auditar.");

        resultDiv.style.display = 'block';
        resultDiv.style.background = "#04080f";
        resultDiv.style.border = "1px solid var(--neon-cyan)";
        resultDiv.style.color = "var(--neon-cyan)";
        resultDiv.innerHTML = "> CALCULANDO DIGEST SHA3-256...<br>> CONSULTANDO NODO ZSECURE EN AWS...";

        const formData = new FormData();
        formData.append('file', docInput.files[0]);

        try {
            const response = await fetch('https://api.zord.cl/api/verify', {
                method: 'POST',
                body: formData
            });
            const data = await response.json();

            if (response.ok && data.status === "verified") {
                const txLink = data.tx_hash
                    ? `<br><strong>BASE MAINNET TX:</strong> <a href="https://basescan.org/tx/${data.tx_hash}" target="_blank" rel="noopener noreferrer" style="color: var(--neon-cyan);">${data.tx_hash} ↗</a>`
                    : '';
                resultDiv.style.background = "rgba(0, 230, 118, 0.08)";
                resultDiv.style.border = "1px solid var(--neon-green)";
                resultDiv.style.color = "var(--neon-green)";
                resultDiv.innerHTML = `
                    <strong>[+] INTEGRIDAD VERIFICADA: ${data.message}</strong><br><br>
                    <strong>HASH:</strong> ${data.hash}<br>
                    <strong>SELLADO POR:</strong> ${data.sealer_address || 'ZSecure PQC Node'}<br>
                    <strong>TIMESTAMP:</strong> ${data.sealed_at || 'Válido'}${txLink}
                `;
            } else {
                resultDiv.style.background = "rgba(255, 61, 0, 0.08)";
                resultDiv.style.border = "1px solid var(--neon-red)";
                resultDiv.style.color = "var(--neon-red)";
                resultDiv.innerHTML = `[-] ${data.detail || data.message || 'El documento no registra sello válido o fue alterado.'}<br><br>HASH: ${data.hash || 'N/A'}`;
            }
        } catch (error) {
            resultDiv.style.background = "rgba(255, 61, 0, 0.08)";
            resultDiv.style.border = "1px solid var(--neon-red)";
            resultDiv.style.color = "var(--neon-red)";
            resultDiv.innerHTML = "[-] ERROR DE CONEXIÓN: Endpoint de verificación no disponible o en mantenimiento.";
        }
    }
</script>
</body>
</html>
